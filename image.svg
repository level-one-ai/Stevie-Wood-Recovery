<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
    <defs>
        <linearGradient id="logoGradient" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" style="stop-color:#6366f1"/>
            <stop offset="50%" style="stop-color:#4f46e5"/>
            <stop offset="100%" style="stop-color:#4338ca"/>
        </linearGradient>
        <linearGradient id="accentGradient" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" style="stop-color:#22d3ee"/>
            <stop offset="100%" style="stop-color:#06b6d4"/>
        </linearGradient>
    </defs>
    
    <!-- Main circle background -->
    <circle cx="100" cy="100" r="90" fill="url(#logoGradient)"/>
    
    <!-- Glass reflection effect -->
    <ellipse cx="100" cy="60" rx="70" ry="40" fill="rgba(255,255,255,0.12)"/>
    
    <!-- Accent dot -->
    <circle cx="158" cy="42" r="12" fill="url(#accentGradient)"/>
    
    <!-- SW Monogram -->
    <g transform="translate(100, 100) scale(2.8) translate(-30, -30)">
        <!-- S letter - flowing curve -->
        <path d="M18 18C18 18 22 14 28 14C34 14 36 18 36 21C36 24 34 27 28 29C22 31 18 33 18 38C18 43 22 46 28 46C34 46 38 42 38 42" 
              stroke="white" 
              stroke-width="3.5" 
              stroke-linecap="round" 
              stroke-linejoin="round"
              fill="none"/>
        <!-- W letter - integrated design -->
        <path d="M32 22L36 42L42 30L48 42L52 22" 
              stroke="white" 
              stroke-width="3.5" 
              stroke-linecap="round" 
              stroke-linejoin="round"
              fill="none"/>
    </g>
</svg>
